<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site</title>
  <style>
    body {
      background-color: black;
      color: white;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
    }
    .media-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    img {
      max-width: 80vw;
      max-height: 60vh;
      height: auto;
    }
    .download-btn {
      color: white;
      text-decoration: none;
      border: 2px solid white;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 20px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }
    .download-btn:hover {
      background-color: white;
      color: black;
    }
  </style>
</head>
<body>
  <div class="media-container">
    <img src="joystick.png" alt="Joystick">
    <a href="joystick.png" download="joystick.png" class="download-btn" title="Download Image">&#10095;</a>
  </div>
  <p>Lend us 10p for a cuppa tea</p>
</body>
</html>
